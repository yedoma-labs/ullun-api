name: Security Audit

on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths: ["Cargo.toml", "Cargo.lock"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
